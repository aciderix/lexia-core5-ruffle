<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruffle Player</title>
    <script>
        var params = new URLSearchParams(window.location.search);
        var swfPath = params.get('swf') || '';
        var baseUrl = params.get('base') || '';
        var backUrl = params.get('from') || 'browser.html';

        var swfUrl = baseUrl + swfPath;
        var ruffleJsUrl = baseUrl + 'ruffle/web/ruffle.js';

        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: 'on',
            unmuteOverlay: 'visible',
            backgroundColor: '#FFFFFF',
            letterbox: 'on',
            contextMenu: 'off',
            showSwfDownload: false,
        };
    </script>
    <script src="ruffle/web/ruffle.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; padding: 0; overflow: hidden; background: #fff; }
        object { display: block; }
        #back-btn {
            position: fixed; top: 10px; left: 10px; z-index: 999;
            background: #1e3a5f; color: #fff; border: none;
            padding: 8px 16px; border-radius: 6px; cursor: pointer;
            font-size: 14px; font-family: -apple-system, sans-serif;
            text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        #back-btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <a id="back-btn" href="javascript:history.back()">← Back</a>
    <script>
        document.write(
            '<object data="' + swfUrl + '" type="application/x-shockwave-flash" width="800" height="600">' +
            '<param name="movie" value="' + swfUrl + '">' +
            '<param name="quality" value="high">' +
            '<param name="bgcolor" value="#FFFFFF">' +
            '</object>'
        );
    </script>
</body>
</html>
