<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexia Core5 — Content Browser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a; color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        header {
            background: linear-gradient(135deg, #1e3a5f, #2563eb);
            padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        header h1 { font-size: 22px; font-weight: 600; color: #fff; }
        header .subtitle { font-size: 13px; color: #93c5fd; margin-top: 2px; }
        #status-badge {
            font-size: 12px; padding: 4px 12px; border-radius: 12px;
            background: rgba(255,255,255,0.15); color: #bfdbfe;
        }
        main { display: flex; flex: 1; overflow: hidden; }
        #sidebar {
            width: 280px; background: #1e293b; border-right: 1px solid #334155;
            overflow-y: auto; flex-shrink: 0;
        }
        .level-group { border-bottom: 1px solid #334155; }
        .level-header {
            padding: 14px 18px; cursor: pointer; display: flex; align-items: center;
            justify-content: space-between; transition: background 0.15s; font-weight: 600;
            font-size: 15px; color: #cbd5e1;
        }
        .level-header:hover { background: #334155; }
        .level-header.active { background: #2563eb; color: #fff; }
        .level-header .count {
            font-size: 12px; font-weight: 400; color: #64748b;
            background: #334155; padding: 2px 8px; border-radius: 8px;
        }
        .level-header.active .count { background: rgba(255,255,255,0.2); color: #fff; }
        .level-items { display: none; padding: 4px 0; }
        .level-items.show { display: block; }
        .activity-item {
            padding: 8px 18px 8px 36px; cursor: pointer; font-size: 13px; color: #94a3b8;
            display: flex; align-items: center; justify-content: space-between; transition: all 0.15s;
        }
        .activity-item:hover { background: #334155; color: #e2e8f0; }
        .activity-item.active { background: #1e40af; color: #fff; }
        .activity-item .badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
        .badge-as2 { background: #059669; color: #d1fae5; }
        .badge-as3 { background: #b45309; color: #fef3c7; }
        .activity-item .size { font-size: 11px; color: #475569; }
        #player-area {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 20px; overflow: auto;
        }
        #player-container {
            width: 800px; height: 600px; background: #fff;
            border-radius: 8px; overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5); position: relative;
            flex-shrink: 0;
        }
        #placeholder {
            display: flex; align-items: center; justify-content: center; height: 100%;
            color: #475569; font-size: 16px; text-align: center;
        }
        #player-container iframe {
            border: none; display: block; border-radius: 8px;
        }
        #player-controls { margin-top: 16px; display: flex; gap: 12px; align-items: center; }
        .btn {
            background: #334155; color: #e2e8f0; border: none; padding: 10px 20px;
            border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500;
            transition: all 0.15s; display: flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: #475569; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary { background: #2563eb; }
        .btn-primary:hover { background: #1d4ed8; }
        #now-playing { color: #64748b; font-size: 13px; }
        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-track { background: #1e293b; }
        #sidebar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Lexia Core5 — Content Browser</h1>
            <div class="subtitle">Direct SWF content player (Ruffle)</div>
        </div>
        <div id="status-badge">Loading catalog...</div>
    </header>
    <main>
        <div id="sidebar"></div>
        <div id="player-area">
            <div id="player-container">
                <div id="placeholder">Select an activity from the sidebar to start</div>
            </div>
            <div id="player-controls">
                <button class="btn" id="btn-prev" disabled>← Prev</button>
                <button class="btn btn-primary" id="btn-reload" disabled>↻ Reload</button>
                <button class="btn" id="btn-next" disabled>Next →</button>
                <span id="now-playing"></span>
            </div>
        </div>
    </main>
    <script>
        // Detect base URL for absolute paths inside iframe
        var BASE_URL = window.location.href.replace(/browser\.html.*$/, '');

        const as2Levels = {0:1,1:21,2:98,3:30,4:2,5:6,6:3,8:10,9:92,10:16};
        let catalog = {};
        let currentLevel = null;
        let currentActivityIndex = -1;
        let currentActivities = [];
        let currentBlobUrl = null;

        fetch('swf/catalog.json')
            .then(r => r.json())
            .then(data => {
                catalog = data;
                document.getElementById('status-badge').textContent =
                    Object.values(data).reduce((s, a) => s + a.length, 0) + ' activities';
                buildSidebar(data);
            })
            .catch(e => {
                document.getElementById('status-badge').textContent = 'Catalog failed';
                buildFallback();
            });

        function isAS2(level, index) {
            return index < (as2Levels[level] || 0);
        }

        function buildSidebar(data) {
            const sidebar = document.getElementById('sidebar');
            const levels = Object.keys(data).map(Number).sort((a,b) => a - b);
            levels.forEach(level => {
                const activities = data[level];
                const group = document.createElement('div');
                group.className = 'level-group';
                const header = document.createElement('div');
                header.className = 'level-header';
                header.innerHTML = 'Level ' + level + ' <span class="count">' + activities.length + '</span>';
                header.onclick = () => {
                    const items = group.querySelector('.level-items');
                    document.querySelectorAll('.level-items').forEach(el => { if (el !== items) el.classList.remove('show'); });
                    document.querySelectorAll('.level-header').forEach(el => { if (el !== header) el.classList.remove('active'); });
                    items.classList.toggle('show');
                    header.classList.toggle('active');
                    currentLevel = level;
                    currentActivities = activities;
                };
                const items = document.createElement('div');
                items.className = 'level-items';
                activities.forEach((act, idx) => {
                    const item = document.createElement('div');
                    item.className = 'activity-item';
                    const as2 = isAS2(level, idx);
                    const badge = as2
                        ? '<span class="badge badge-as2">AS2</span>'
                        : '<span class="badge badge-as3">AS3</span>';
                    const sizeKB = (act.size / 1024).toFixed(0);
                    item.innerHTML = '<span>Activity ' + act.num + '</span><span style="display:flex;align-items:center;gap:4px">' + badge + '<span class="size">' + sizeKB + 'KB</span></span>';
                    item.onclick = () => {
                        document.querySelectorAll('.activity-item').forEach(el => el.classList.remove('active'));
                        item.classList.add('active');
                        currentActivityIndex = idx;
                        loadActivity(act);
                    };
                    items.appendChild(item);
                });
                group.appendChild(header);
                group.appendChild(items);
                sidebar.appendChild(group);
            });
        }

        function buildFallback() {
            const sidebar = document.getElementById('sidebar');
            for (let level = 0; level <= 10; level++) {
                const group = document.createElement('div');
                group.className = 'level-group';
                const header = document.createElement('div');
                header.className = 'level-header';
                header.textContent = 'Level ' + level;
                header.onclick = () => { group.querySelector('.level-items').classList.toggle('show'); };
                const items = document.createElement('div');
                items.className = 'level-items';
                for (let i = 0; i < 100; i++) {
                    const num = level * 100 + i;
                    const path = 'swf/content/' + level + '/swf_' + String(num).padStart(4, '0') + '.swf';
                    const item = document.createElement('div');
                    item.className = 'activity-item';
                    item.textContent = 'Activity ' + num;
                    item.onclick = () => loadActivity({ path, num });
                    items.appendChild(item);
                }
                group.appendChild(header);
                group.appendChild(items);
                sidebar.appendChild(group);
            }
        }

        function loadActivity(act) {
            const container = document.getElementById('player-container');

            // Revoke previous blob URL
            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
            }

            // Build absolute URLs for use inside the iframe
            var swfUrl = BASE_URL + act.path;
            var ruffleJsUrl = BASE_URL + 'ruffle/web/ruffle.js';

            // Build full HTML document with <object> tag in initial HTML
            // Ruffle polyfill only works when object is in the initial DOM
            var html =
                '<!DOCTYPE html><html><head>' +
                '<script>\n' +
                'window.RufflePlayer = window.RufflePlayer || {};\n' +
                'window.RufflePlayer.config = {\n' +
                '  autoplay: "on",\n' +
                '  unmuteOverlay: "visible",\n' +
                '  backgroundColor: "#FFFFFF",\n' +
                '  letterbox: "on",\n' +
                '  contextMenu: "off"\n' +
                '};\n' +
                '</scr' + 'ipt>\n' +
                '<script src="' + ruffleJsUrl + '"></scr' + 'ipt>\n' +
                '</head>\n' +
                '<body style="margin:0;padding:0;overflow:hidden;background:#fff">\n' +
                '<object data="' + swfUrl + '" type="application/x-shockwave-flash" width="800" height="600">\n' +
                '  <param name="movie" value="' + swfUrl + '">\n' +
                '  <param name="quality" value="high">\n' +
                '  <param name="bgcolor" value="#FFFFFF">\n' +
                '</object>\n' +
                '</body></html>';

            // Create blob URL for the iframe
            var blob = new Blob([html], { type: 'text/html' });
            currentBlobUrl = URL.createObjectURL(blob);

            // Create iframe with blob URL
            var iframe = document.createElement('iframe');
            iframe.src = currentBlobUrl;
            iframe.style.width = '800px';
            iframe.style.height = '600px';
            iframe.style.border = 'none';
            iframe.style.display = 'block';
            iframe.style.borderRadius = '8px';

            container.innerHTML = '';
            container.appendChild(iframe);

            document.getElementById('now-playing').textContent = 'Playing: Activity ' + act.num;
            document.getElementById('btn-prev').disabled = currentActivityIndex <= 0;
            document.getElementById('btn-next').disabled = currentActivityIndex >= currentActivities.length - 1;
            document.getElementById('btn-reload').disabled = false;
        }

        document.getElementById('btn-prev').onclick = () => {
            if (currentActivityIndex > 0) {
                currentActivityIndex--;
                const act = currentActivities[currentActivityIndex];
                document.querySelectorAll('.activity-item').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.level-items.show .activity-item')[currentActivityIndex].classList.add('active');
                loadActivity(act);
            }
        };
        document.getElementById('btn-next').onclick = () => {
            if (currentActivityIndex < currentActivities.length - 1) {
                currentActivityIndex++;
                const act = currentActivities[currentActivityIndex];
                document.querySelectorAll('.activity-item').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.level-items.show .activity-item')[currentActivityIndex].classList.add('active');
                loadActivity(act);
            }
        };
        document.getElementById('btn-reload').onclick = () => {
            if (currentActivityIndex >= 0) loadActivity(currentActivities[currentActivityIndex]);
        };
    </script>
</body>
</html>
