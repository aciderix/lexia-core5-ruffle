<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexia Core5 — Content Browser</title>
    <script>
        var params = new URLSearchParams(window.location.search);
        var swfPath = params.get('swf') || '';
        var currentLevel = params.get('level') || '';

        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: 'on',
            unmuteOverlay: 'visible',
            backgroundColor: '#FFFFFF',
            letterbox: 'on',
            contextMenu: 'off',
            showSwfDownload: false,
        };
    </script>
    <script src="ruffle/web/ruffle.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a; color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        header {
            background: linear-gradient(135deg, #1e3a5f, #2563eb);
            padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        header h1 { font-size: 18px; font-weight: 600; color: #fff; }
        header .subtitle { font-size: 12px; color: #93c5fd; margin-top: 2px; }
        #status-badge {
            font-size: 12px; padding: 4px 12px; border-radius: 12px;
            background: rgba(255,255,255,0.15); color: #bfdbfe;
        }
        main { display: flex; flex: 1; overflow: hidden; }
        #sidebar {
            width: 240px; background: #1e293b; border-right: 1px solid #334155;
            overflow-y: auto; flex-shrink: 0;
        }
        .level-group { border-bottom: 1px solid #334155; }
        .level-header {
            padding: 12px 16px; cursor: pointer; display: flex; align-items: center;
            justify-content: space-between; transition: background 0.15s; font-weight: 600;
            font-size: 14px; color: #cbd5e1;
        }
        .level-header:hover { background: #334155; }
        .level-header.active { background: #2563eb; color: #fff; }
        .level-header .count {
            font-size: 11px; font-weight: 400; color: #64748b;
            background: #334155; padding: 2px 8px; border-radius: 8px;
        }
        .level-header.active .count { background: rgba(255,255,255,0.2); color: #fff; }
        .level-items { display: none; padding: 4px 0; }
        .level-items.show { display: block; }
        .activity-item {
            padding: 6px 16px 6px 32px; cursor: pointer; font-size: 12px; color: #94a3b8;
            display: flex; align-items: center; justify-content: space-between; transition: all 0.15s;
            text-decoration: none;
        }
        .activity-item:hover { background: #334155; color: #e2e8f0; }
        .activity-item.active { background: #1e40af; color: #fff; }
        .activity-item .badge { font-size: 9px; padding: 1px 5px; border-radius: 4px; margin-left: 4px; }
        .badge-as2 { background: #059669; color: #d1fae5; }
        .badge-as3 { background: #b45309; color: #fef3c7; }
        .activity-item .size { font-size: 10px; color: #475569; }
        #player-area {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 20px; overflow: auto;
        }
        #player-container {
            width: 800px; height: 600px; background: #fff;
            border-radius: 8px; overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5); position: relative;
            flex-shrink: 0;
        }
        #placeholder {
            display: flex; align-items: center; justify-content: center; height: 100%;
            color: #475569; font-size: 16px; text-align: center;
        }
        #player-controls { margin-top: 12px; display: flex; gap: 10px; align-items: center; }
        .btn {
            background: #334155; color: #e2e8f0; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;
            transition: all 0.15s;
        }
        .btn:hover { background: #475569; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary { background: #2563eb; }
        .btn-primary:hover { background: #1d4ed8; }
        #now-playing { color: #64748b; font-size: 12px; }
        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-track { background: #1e293b; }
        #sidebar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        #debug-info {
            position: fixed; top: 50px; right: 10px; z-index: 9999;
            background: #1a1a2e; color: #0f0; padding: 8px 12px;
            font-size: 11px; font-family: monospace; border-radius: 6px;
            max-width: 400px; word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="debug-info">DEBUG: initializing...</div>
    <header>
        <div>
            <h1>Lexia Core5 — Content Browser</h1>
            <div class="subtitle">Direct SWF content player (Ruffle)</div>
        </div>
        <div id="status-badge">Loading catalog...</div>
    </header>
    <main>
        <div id="sidebar"></div>
        <div id="player-area">
            <div id="player-container">
                <div id="placeholder">Select an activity from the sidebar to start</div>
            </div>
            <div id="player-controls">
                <button class="btn" id="btn-prev" disabled>← Prev</button>
                <button class="btn btn-primary" id="btn-reload" disabled>↻ Reload</button>
                <button class="btn" id="btn-next" disabled>Next →</button>
                <span id="now-playing"></span>
            </div>
        </div>
    </main>
    <script>
        var BASE_URL = window.location.href.replace(/browser\.html.*$/, '');
        var as2Levels = {0:1,1:21,2:98,3:30,4:2,5:6,6:3,8:10,9:92,10:16};
        var catalog = {};
        var currentActivities = [];
        var currentActivityIndex = -1;

        document.getElementById('debug-info').textContent = 'DEBUG: swfPath=' + swfPath;

        // If a SWF is specified, load it after DOM is ready
        if (swfPath) {
            window.addEventListener('DOMContentLoaded', function() {
                loadSwf(swfPath);
            });
        }

        function loadSwf(path) {
            var container = document.getElementById('player-container');
            container.innerHTML = '';

            // Create object element — Ruffle's MutationObserver should detect it
            var obj = document.createElement('object');
            obj.setAttribute('data', path);
            obj.setAttribute('type', 'application/x-shockwave-flash');
            obj.setAttribute('width', '800');
            obj.setAttribute('height', '600');

            var param1 = document.createElement('param');
            param1.setAttribute('name', 'movie');
            param1.setAttribute('value', path);
            obj.appendChild(param1);

            var param2 = document.createElement('param');
            param2.setAttribute('name', 'quality');
            param2.setAttribute('value', 'high');
            obj.appendChild(param2);

            var param3 = document.createElement('param');
            param3.setAttribute('name', 'bgcolor');
            param3.setAttribute('value', '#FFFFFF');
            obj.appendChild(param3);

            container.appendChild(obj);

            document.getElementById('debug-info').textContent = 'DEBUG: object appended, data=' + path;

            // Try to manually trigger Ruffle polyfill if available
            setTimeout(function() {
                var debugEl = document.getElementById('debug-info');
                var objInDom = document.querySelector('#player-container object');
                var ruffleObj = document.querySelector('#player-container ruffle-object');
                var objCount = document.querySelectorAll('#player-container object').length;
                var ruffleCount = document.querySelectorAll('#player-container ruffle-object').length;
                debugEl.textContent = 'DEBUG: obj=' + objCount + ' ruffle=' + ruffleCount +
                    ' RufflePlayer=' + (typeof window.RufflePlayer) +
                    ' Ruffle=' + (window.Ruffle ? 'yes' : 'no');
            }, 3000);
        }

        fetch('swf/catalog.json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                catalog = data;
                document.getElementById('status-badge').textContent =
                    Object.values(data).reduce(function(s, a) { return s + a.length; }, 0) + ' activities';
                buildSidebar(data);
                if (swfPath) {
                    findCurrentActivity(data);
                }
            })
            .catch(function(e) {
                document.getElementById('status-badge').textContent = 'Catalog failed';
                buildFallback();
            });

        function isAS2(level, index) {
            return index < (as2Levels[level] || 0);
        }

        function buildSidebar(data) {
            var sidebar = document.getElementById('sidebar');
            var levels = Object.keys(data).map(Number).sort(function(a,b) { return a - b; });
            levels.forEach(function(level) {
                var activities = data[level];
                var group = document.createElement('div');
                group.className = 'level-group';
                var header = document.createElement('div');
                header.className = 'level-header';
                if (String(level) === currentLevel) header.classList.add('active');
                header.innerHTML = 'Level ' + level + ' <span class="count">' + activities.length + '</span>';
                header.onclick = function() {
                    var items = group.querySelector('.level-items');
                    document.querySelectorAll('.level-items').forEach(function(el) { if (el !== items) el.classList.remove('show'); });
                    document.querySelectorAll('.level-header').forEach(function(el) { if (el !== header) el.classList.remove('active'); });
                    items.classList.toggle('show');
                    header.classList.toggle('active');
                };
                var items = document.createElement('div');
                items.className = 'level-items';
                if (String(level) === currentLevel) items.classList.add('show');
                activities.forEach(function(act, idx) {
                    var item = document.createElement('a');
                    item.className = 'activity-item';
                    item.href = 'browser.html?swf=' + encodeURIComponent(act.path) + '&level=' + level;
                    if (act.path === swfPath) {
                        item.classList.add('active');
                    }
                    var as2 = isAS2(level, idx);
                    var badge = as2
                        ? '<span class="badge badge-as2">AS2</span>'
                        : '<span class="badge badge-as3">AS3</span>';
                    var sizeKB = (act.size / 1024).toFixed(0);
                    item.innerHTML = '<span>Activity ' + act.num + '</span><span style="display:flex;align-items:center;gap:4px">' + badge + '<span class="size">' + sizeKB + 'KB</span></span>';
                    items.appendChild(item);
                });
                group.appendChild(header);
                group.appendChild(items);
                sidebar.appendChild(group);
            });
        }

        function findCurrentActivity(data) {
            var levels = Object.keys(data).map(Number).sort(function(a,b) { return a - b; });
            for (var i = 0; i < levels.length; i++) {
                var level = levels[i];
                var activities = data[level];
                for (var j = 0; j < activities.length; j++) {
                    if (activities[j].path === swfPath) {
                        currentActivities = activities;
                        currentActivityIndex = j;
                        currentLevel = String(level);
                        document.getElementById('now-playing').textContent = 'Playing: Activity ' + activities[j].num;
                        document.getElementById('btn-prev').disabled = j <= 0;
                        document.getElementById('btn-next').disabled = j >= activities.length - 1;
                        document.getElementById('btn-reload').disabled = false;
                        return;
                    }
                }
            }
        }

        function buildFallback() {
            var sidebar = document.getElementById('sidebar');
            for (var level = 0; level <= 10; level++) {
                var group = document.createElement('div');
                group.className = 'level-group';
                var header = document.createElement('div');
                header.className = 'level-header';
                header.textContent = 'Level ' + level;
                header.onclick = function() { group.querySelector('.level-items').classList.toggle('show'); };
                var items = document.createElement('div');
                items.className = 'level-items';
                for (var i = 0; i < 100; i++) {
                    var num = level * 100 + i;
                    var path = 'swf/content/' + level + '/swf_' + String(num).padStart(4, '0') + '.swf';
                    var item = document.createElement('a');
                    item.className = 'activity-item';
                    item.href = 'browser.html?swf=' + encodeURIComponent(path) + '&level=' + level;
                    item.textContent = 'Activity ' + num;
                    items.appendChild(item);
                }
                group.appendChild(header);
                group.appendChild(items);
                sidebar.appendChild(group);
            }
        }

        document.getElementById('btn-prev').onclick = function() {
            if (currentActivityIndex > 0) {
                var act = currentActivities[currentActivityIndex - 1];
                window.location.href = 'browser.html?swf=' + encodeURIComponent(act.path) + '&level=' + currentLevel;
            }
        };
        document.getElementById('btn-next').onclick = function() {
            if (currentActivityIndex < currentActivities.length - 1) {
                var act = currentActivities[currentActivityIndex + 1];
                window.location.href = 'browser.html?swf=' + encodeURIComponent(act.path) + '&level=' + currentLevel;
            }
        };
        document.getElementById('btn-reload').onclick = function() {
            window.location.reload();
        };
    </script>
</body>
</html>
