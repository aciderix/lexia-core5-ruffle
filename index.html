<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexia Core5 - Ruffle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: monospace; }
        #log { width: 100%; max-width: 1024px; color: #0f0; font-size: 11px; padding: 8px; background: rgba(0,0,0,0.85); max-height: 250px; overflow-y: auto; border-bottom: 1px solid #333; white-space: pre-wrap; }
        #player { width: 1024px; height: 768px; max-width: 100vw; max-height: 100vh; }
        #log .error { color: #f44; }
        #log .warn { color: #ff0; }
        #log .info { color: #0ff; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 18px; }
    </style>
</head>
<body>
    <div id="loading">Loading Ruffle...</div>
    <div id="log"></div>
    <div id="player"></div>

    <script>
        // Log helper
        const logEl = document.getElementById('log');
        function log(msg, type) {
            const div = document.createElement('div');
            if (type) div.className = type;
            div.textContent = '[' + new Date().toISOString().substr(11, 8) + '] ' + msg;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        // Register Service Worker FIRST
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js', { scope: './' })
                .then(reg => {
                    log('Service Worker registered: ' + reg.scope, 'info');
                    return navigator.serviceWorker.ready;
                })
                .then(() => {
                    log('Service Worker ready, loading Ruffle...', 'info');
                    loadRuffle();
                })
                .catch(err => {
                    log('SW registration failed: ' + err.message, 'error');
                    loadRuffle(); // Load anyway
                });
        } else {
            log('Service Worker not supported!', 'error');
            loadRuffle();
        }

        // Listen for SW messages
        navigator.serviceWorker?.addEventListener('message', (e) => {
            log('SW msg: ' + JSON.stringify(e.data), 'info');
        });

        function loadRuffle() {
            document.getElementById('loading').textContent = 'Loading Ruffle runtime...';

            window.RufflePlayer = window.RufflePlayer || {};
            window.RufflePlayer.config = {
                allowFullScreen: true,
                autoplay: "on",
                allowScriptAccess: true,
                allowNetworking: "all",
                logLevel: "warn",
                base: "./",
                maxExecutionDuration: 300
            };

            // Capture console
            const origLog = console.log, origErr = console.error, origWarn = console.warn;
            console.log = function(...a) { log(a.join(' ')); origLog.apply(console, a); };
            console.error = function(...a) { log('ERROR: ' + a.join(' '), 'error'); origErr.apply(console, a); };
            console.warn = function(...a) { log('WARN: ' + a.join(' '), 'warn'); origWarn.apply(console, a); };

            window.addEventListener('error', (e) => {
                log('JS Error: ' + e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''), 'error');
            });

            window.addEventListener('unhandledrejection', (e) => {
                log('Unhandled rejection: ' + (e.reason?.message || e.reason), 'error');
            });

            const ruffle = window.RufflePlayer.newest();
            log('Ruffle version: ' + (ruffle?.version || 'unknown'), 'info');

            const player = document.getElementById('player');
            ruffle.load({
                url: 'swf/main.swf',
                autoplay: "on",
                allowScriptAccess: true,
                allowNetworking: "all",
                base: "./",
                parameters: {}
            }).then(instance => {
                document.getElementById('loading').style.display = 'none';
                log('SWF loaded successfully!', 'info');
            }).catch(err => {
                document.getElementById('loading').textContent = 'Load failed: ' + err.message;
                log('SWF load FAILED: ' + (err.message || err), 'error');
            });
        }
    </script>

    <!-- Load Ruffle from local self-hosted build -->
    <script src="ruffle/web/ruffle.js"></script>
</body>
</html>
