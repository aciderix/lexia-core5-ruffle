<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lexia Core5 Reading</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 1024px;
            height: 768px;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 4/3;
        }
        #game-container object, #game-container embed {
            width: 100% !important;
            height: 100% !important;
        }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #e0e0e0;
            font-size: 24px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        #loading .spinner {
            width: 50px; height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #status {
            position: fixed;
            bottom: 10px; right: 10px;
            color: #888;
            font-size: 12px;
            font-family: monospace;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading Lexia Core5...</p>
        </div>
        <object
            id="flash-object"
            data="swf/main.swf"
            type="application/x-shockwave-flash"
            width="100%"
            height="100%">
            <param name="movie" value="swf/main.swf" />
            <param name="allowFullScreen" value="true" />
            <param name="autoplay" value="true" />
            <param name="quality" value="high" />
            <param name="wmode" value="direct" />
            <param name="allowScriptAccess" value="always" />
        </object>
    </div>
    <div id="status">Initializing...</div>

    <script src="ruffle/ruffle.js"></script>
    <script>
        // Register Service Worker for AMF bypass
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                document.getElementById('status').textContent = 'AMF Bypass: Active';
            }).catch(() => {
                document.getElementById('status').textContent = 'AMF Bypass: Failed';
            });
        }

        // Ruffle config
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            allowFullScreen: true,
            autoplay: "on",
            unmixedBehavior: "allow",
            letterbox: "on",
            warnOnUnsupportedContent: true
        };

        // Hide loading when Ruffle starts playing
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loading = document.getElementById('loading');
                if (loading) {
                    // Check if Ruffle has replaced the object
                    const container = document.getElementById('game-container');
                    const ruffleEl = container.querySelector('ruffle-player, ruffle-object, canvas');
                    if (ruffleEl) {
                        loading.style.display = 'none';
                        document.getElementById('status').textContent = 'Running ✓';
                    } else {
                        // Wait a bit more
                        setTimeout(() => {
                            loading.style.display = 'none';
                            document.getElementById('status').textContent = 'Running';
                        }, 3000);
                    }
                }
            }, 2000);
        });
    </script>
</body>
</html>
