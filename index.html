<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lexia Core5 Reading</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 1024px;
            height: 768px;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 4/3;
        }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #e0e0e0;
            font-size: 24px;
            text-align: center;
            z-index: 10;
        }
        #loading .spinner {
            width: 50px; height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #ruffle-container { width: 100%; height: 100%; }
        #ruffle-container ruffle-player, #ruffle-container ruffle-object {
            width: 100% !important;
            height: 100% !important;
        }
        #status {
            position: fixed;
            bottom: 10px; right: 10px;
            color: #888;
            font-size: 12px;
            font-family: monospace;
            z-index: 100;
        }
        #debug-log {
            position: fixed;
            bottom: 30px; right: 10px;
            color: #ff6;
            font-size: 11px;
            font-family: monospace;
            max-width: 400px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading Lexia Core5...</p>
        </div>
        <div id="ruffle-container">
            <ruffle-player id="player"></ruffle-player>
        </div>
    </div>
    <div id="status">Initializing...</div>
    <div id="debug-log"></div>

    <script src="ruffle/ruffle.js"></script>
    <script>
        // Register Service Worker for AMF bypass
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                document.getElementById('status').textContent = 'AMF Bypass: Active';
            }).catch(err => {
                document.getElementById('status').textContent = 'AMF Bypass: Failed';
                console.error('SW registration failed:', err);
            });
        }

        // Ruffle config
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "allowFullScreen": true,
            "autoplay": "on",
            "unmixedBehavior": "allow",
            "letterbox": "on",
            "warnOnUnsupportedContent": false
        };

        function debugLog(msg) {
            console.log('[Lexia] ' + msg);
            const el = document.getElementById('debug-log');
            el.style.display = 'block';
            el.innerHTML += msg + '<br>';
            el.scrollTop = el.scrollHeight;
        }

        window.addEventListener('load', async () => {
            const loading = document.getElementById('loading');
            const player = document.getElementById('player');
            
            try {
                debugLog('Loading Ruffle player...');
                // Wait a moment for Ruffle to initialize
                await new Promise(r => setTimeout(r, 500));
                
                debugLog('Loading main.swf...');
                await player.load('swf/main.swf');
                loading.style.display = 'none';
                document.getElementById('status').textContent = 'Running';
                debugLog('SWF loaded successfully!');
            } catch (e) {
                debugLog('Error: ' + e.message);
                loading.innerHTML = '<p style="color:#e74c3c">Error: ' + e.message + '</p>';
            }
        });
    </script>
</body>
</html>
