<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lexia Debug</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#111;color:#0f0;font-family:monospace;font-size:11px}#d{padding:10px;max-height:100vh;overflow-y:auto}#d .e{color:#f44}#d .w{color:#ff0}#g{position:fixed;top:-9999px}</style>
</head>
<body>
<div id="d"></div>
<div id="g"><object id="swf" data="swf/main.swf" type="application/x-shockwave-flash" width="1024" height="768"><param name="movie" value="swf/main.swf"/><param name="allowScriptAccess" value="always"/><param name="autoplay" value="true"/></object></div>
<script src="ruffle/ruffle.js"></script>
<script>
const d=document.getElementById('d');
const lines=[];
function log(m,c){lines.push({m:String(m).slice(0,300),c:c||''});if(lines.length>30)lines.shift();d.innerHTML=lines.map(l=>'<div class="'+l.c+'">'+l.m.replace(/</g,'&lt;')+'</div>').join('');d.scrollTop=d.scrollHeight;}
console.log=(...a)=>log(a.join(' '));
console.error=(...a)=>log('[E] '+a.join(' '),'e');
console.warn=(...a)=>log('[W] '+a.join(' '),'w');
window.onerror=(m,s,l)=>log('[ERR] '+m+' :'+l,'e');
window.RufflePlayer={config:{autoplay:"on",warnOnUnsupportedContent:true,logLevel:"debug"}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
log('Loading...');
setTimeout(()=>log('5s'),5000);
setTimeout(()=>log('15s'),15000);
setTimeout(()=>log('30s'),30000);
</script>
</body>
</html>
