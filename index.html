<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexia Core5 (Debug)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; font-family: monospace; }
        #debug { position: fixed; top: 0; left: 0; right: 0; height: 100vh; overflow-y: auto; padding: 10px; color: #0f0; font-size: 12px; }
        #debug .err { color: #f44; }
        #debug .warn { color: #ff0; }
        #game { position: fixed; top: -9999px; }
    </style>
</head>
<body>
    <div id="debug"></div>
    <div id="game">
        <object id="swf" data="swf/main.swf" type="application/x-shockwave-flash" width="1024" height="768">
            <param name="movie" value="swf/main.swf" />
            <param name="allowScriptAccess" value="always" />
            <param name="autoplay" value="true" />
        </object>
    </div>
    <script src="ruffle/ruffle.js"></script>
    <script>
        const d = document.getElementById('debug');
        const lines = [];
        let maxLines = 50;
        
        function log(msg, cls) {
            lines.push({msg: String(msg).slice(0, 200), cls: cls || ''});
            if (lines.length > maxLines) lines.shift();
            d.innerHTML = lines.map(l => '<div class="'+l.cls+'">'+l.msg.replace(/</g,'&lt;')+'</div>').join('');
            d.scrollTop = d.scrollHeight;
        }
        
        console.log = (...a) => log(a.join(' '));
        console.error = (...a) => log('[ERR] '+a.join(' '), 'err');
        console.warn = (...a) => log('[WARN] '+a.join(' '), 'warn');
        window.onerror = (m,s,l) => log('[UNCAUGHT] '+m+' :'+l, 'err');
        
        window.RufflePlayer = { config: { autoplay: "on", warnOnUnsupportedContent: true, logLevel: "debug" } };
        
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        
        log('Page loaded, Ruffle starting...');
        
        let n = 0;
        setInterval(() => {
            n++;
            const r = document.querySelector('ruffle-object, ruffle-player');
            const c = document.querySelector('canvas');
            if (n <= 3) log('Check '+n+': ruffle='+(r?'YES':'NO')+' canvas='+(c?'YES':'NO'));
            if (n === 5) log('Stopping periodic checks', 'warn');
        }, 1000);
        
        setTimeout(() => log('10s elapsed'), 10000);
        setTimeout(() => log('20s elapsed'), 20000);
        setTimeout(() => log('30s elapsed'), 30000);
    </script>
</body>
</html>
