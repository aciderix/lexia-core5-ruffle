<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lexia Core5 Reading</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 1024px;
            height: 768px;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 4/3;
        }
        #game-container > * { width: 100%; height: 100%; }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #e0e0e0;
            font-size: 24px;
            text-align: center;
            z-index: 10;
        }
        #loading .spinner {
            width: 50px; height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #ruffle-container { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading Lexia Core5...</p>
        </div>
        <div id="ruffle-container"></div>
    </div>
    <script src="ruffle/ruffle.js"></script>
    <script>
        window.RuffleConfig = {
            "allowFullScreen": true,
            "autoplay": "on",
            "unmixedBehavior": "allow",
        };

        window.addEventListener('load', async () => {
            await new Promise(r => setTimeout(r, 500));
            const container = document.getElementById('ruffle-container');
            const loading = document.getElementById('loading');
            
            try {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.create_player();
                container.appendChild(player);
                player.style.width = '100%';
                player.style.height = '100%';
                await player.load_swf_url('swf/main.swf');
                loading.style.display = 'none';
            } catch (e) {
                loading.innerHTML = '<p style="color:#e74c3c">Error: ' + e.message + '</p>';
                console.error(e);
            }
        });

        window.__lexiaBypass = {
            mockResponses: {
                'HandshakeRequestVO': { success: true, sessionId: 'offline-001' },
                'LoginRequestVO': { success: true, studentId: 1, studentName: 'Student', authToken: 'mock-token' },
                'VerifySiteIdRequestVO': { success: true, siteId: '0000', siteName: 'Offline' },
                'UnitStatusRequestVO': { success: true, units: [] },
                'StepEndRequestVO': { success: true },
                'LogoutRequestVO': { success: true },
                'TeacherRequestVO': { success: true, teacherName: 'Teacher' },
                'SaveWarmupScoreRequestVO': { success: true },
                'LoggingRequestVO': { success: true },
            },
            enabled: true
        };
    </script>
</body>
</html>
