<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lexia Core5 Reading</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }
        #game-container { position: relative; width: 1024px; height: 768px; max-width: 100vw; max-height: 100vh; aspect-ratio: 4/3; }
        #game-container object, #game-container ruffle-object { width: 100% !important; height: 100% !important; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #e0e0e0; font-size: 20px; text-align: center; z-index: 5; pointer-events: none; opacity: 1; transition: opacity 1s; }
        #loading.hidden { opacity: 0; }
        #status { position: fixed; bottom: 10px; right: 10px; color: #666; font-size: 11px; font-family: monospace; z-index: 100; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading">
            <p>Loading Lexia Core5...</p>
            <p id="detail" style="font-size:13px;color:#666;margin-top:8px">Initializing...</p>
        </div>
    </div>
    <div id="status">Starting...</div>
    <script src="ruffle/ruffle.js"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            allowFullScreen: true,
            autoplay: "on",
            warnOnUnsupportedContent: false,
            allowScriptAccess: true,
            allowNetworking: "all",
            upgradeToHttps: true,
            logLevel: "info",
            base: ".",
            preloader: false,
            splashScreen: false,
            maxExecutionDuration: 60
        };

        function setStatus(msg) {
            var el = document.getElementById('status');
            var det = document.getElementById('detail');
            if (el) el.textContent = msg;
            if (det) det.textContent = msg;
            console.log('[App]', msg);
        }

        function waitForSW() {
            return new Promise(function(resolve) {
                if (!('serviceWorker' in navigator)) {
                    resolve(false);
                    return;
                }
                setStatus('Registering service worker...');
                navigator.serviceWorker.register('sw.js').then(function(reg) {
                    if (reg.active) {
                        setStatus('SW active');
                        resolve(true);
                        return;
                    }
                    var sw = reg.installing || reg.waiting;
                    if (!sw) {
                        setStatus('SW active');
                        resolve(true);
                        return;
                    }
                    setStatus('Waiting for SW...');
                    sw.addEventListener('statechange', function() {
                        if (sw.state === 'activated') {
                            setStatus('SW activated');
                            resolve(true);
                        }
                    });
                    setTimeout(function() { resolve(true); }, 8000);
                }).catch(function(err) {
                    resolve(false);
                });
            });
        }

        function loadSWF() {
            setStatus('Loading SWF...');
            var container = document.getElementById('game-container');
            var obj = document.createElement('object');
            obj.id = 'flash-object';
            obj.setAttribute('data', 'swf/main_single.swf');
            obj.setAttribute('type', 'application/x-shockwave-flash');
            obj.setAttribute('width', '100%');
            obj.setAttribute('height', '100%');
            obj.innerHTML =
                '<param name="movie" value="swf/main_single.swf" />' +
                '<param name="allowFullScreen" value="true" />' +
                '<param name="autoplay" value="true" />' +
                '<param name="quality" value="high" />' +
                '<param name="allowScriptAccess" value="always" />' +
                '<param name="allowNetworking" value="all" />' +
                '<param name="base" value="." />';
            container.appendChild(obj);

            // Hide loading text after 8s regardless (Ruffle shows its own UI)
            setTimeout(function() {
                var loading = document.getElementById('loading');
                if (loading) loading.classList.add('hidden');
                setStatus('Running');
            }, 8000);
        }

        waitForSW().then(loadSWF);
    </script>
</body>
</html>
