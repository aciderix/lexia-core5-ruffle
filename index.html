<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lexia Core5 Reading</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 1024px;
            height: 768px;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 4/3;
        }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #e0e0e0;
            font-size: 24px;
            text-align: center;
            z-index: 10;
        }
        #loading .spinner {
            width: 50px; height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #ruffle-container { width: 100%; height: 100%; }
        #ruffle-container ruffle-player {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
        #status {
            position: fixed;
            bottom: 10px; right: 10px;
            color: #888;
            font-size: 12px;
            font-family: monospace;
            z-index: 100;
        }
        #debug-log {
            position: fixed;
            bottom: 30px; left: 10px;
            color: #ff6;
            font-size: 11px;
            font-family: monospace;
            max-width: 500px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading Lexia Core5...</p>
        </div>
        <div id="ruffle-container">
            <ruffle-player id="player" src="swf/main.swf"></ruffle-player>
        </div>
    </div>
    <div id="status">Initializing...</div>
    <div id="debug-log"></div>

    <script src="ruffle/ruffle.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                document.getElementById('status').textContent = 'AMF Bypass: Active';
            }).catch(err => {
                document.getElementById('status').textContent = 'AMF Bypass: Failed';
            });
        }

        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            allowFullScreen: true,
            autoplay: "on",
            unmixedBehavior: "allow",
            letterbox: "on",
            warnOnUnsupportedContent: true
        };

        function debugLog(msg) {
            console.log('[Lexia] ' + msg);
            const el = document.getElementById('debug-log');
            el.innerHTML += msg + '<br>';
            el.scrollTop = el.scrollHeight;
        }

        window.addEventListener('load', () => {
            const loading = document.getElementById('loading');
            const player = document.getElementById('player');
            
            debugLog('Ruffle player found: ' + (player ? 'yes' : 'no'));
            debugLog('Player tagName: ' + player.tagName);
            debugLog('Player methods: ' + Object.getOwnPropertyNames(Object.getPrototypeOf(player)).join(', '));
            
            // Listen for load/error events
            player.addEventListener('loadedmetadata', () => {
                debugLog('SWF loaded!');
                loading.style.display = 'none';
                document.getElementById('status').textContent = 'Running';
            });
            
            player.addEventListener('error', (e) => {
                debugLog('Error event: ' + JSON.stringify(e.detail || e.message || e));
                loading.innerHTML = '<p style="color:#e74c3c">Error loading SWF</p>';
            });
            
            // Also try to play after Ruffle initializes
            setTimeout(() => {
                debugLog('Checking player state...');
                if (player.play) {
                    debugLog('Calling play()...');
                    player.play().catch(e => debugLog('Play error: ' + e));
                }
                if (player.load) {
                    debugLog('Has load method');
                }
                debugLog('Player attributes: ' + player.getAttribute('src'));
            }, 2000);
        });
    </script>
</body>
</html>
