<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexia Core5 - Ruffle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: monospace; }
        #log { width: 100%; max-width: 1024px; color: #0f0; font-size: 11px; padding: 8px; background: rgba(0,0,0,0.85); max-height: 250px; overflow-y: auto; border-bottom: 1px solid #333; white-space: pre-wrap; }
        #player { width: 1024px; height: 768px; max-width: 100vw; max-height: 100vh; }
        #log .error { color: #f44; }
        #log .warn { color: #ff0; }
        #log .info { color: #0ff; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 18px; z-index: 1; }
    </style>
</head>
<body>
    <div id="loading">Loading Ruffle...</div>
    <div id="log"></div>
    <div id="player"></div>

    <script>
        // Log helper
        const logEl = document.getElementById('log');
        function log(msg, type) {
            const div = document.createElement('div');
            if (type) div.className = type;
            div.textContent = '[' + new Date().toISOString().substr(11, 8) + '] ' + msg;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        // Register Service Worker FIRST
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js', { scope: './' })
                .then(reg => {
                    log('Service Worker registered: ' + reg.scope, 'info');
                    return navigator.serviceWorker.ready;
                })
                .then(() => log('Service Worker ready', 'info'))
                .catch(err => log('SW registration failed: ' + err.message, 'error'));
        }

        // Ruffle config — MUST be set before ruffle.js loads
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            allowFullScreen: true,
            autoplay: "on",
            allowScriptAccess: true,
            allowNetworking: "all",
            logLevel: "warn",
            base: "./",
            maxExecutionDuration: 300,
            publicPath: "./ruffle/web/",
            letterbox: "on"
        };

        // Capture console
        const origLog = console.log, origErr = console.error, origWarn = console.warn;
        console.log = function(...a) { log(a.join(' ')); origLog.apply(console, a); };
        console.error = function(...a) { log('ERROR: ' + a.join(' '), 'error'); origErr.apply(console, a); };
        console.warn = function(...a) { log('WARN: ' + a.join(' '), 'warn'); origWarn.apply(console, a); };

        window.addEventListener('error', (e) => {
            log('JS Error: ' + e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''), 'error');
        });

        // Load the SWF using Ruffle's programmatic API
        window.addEventListener('load', async () => {
            log('Page loaded, waiting for Ruffle...', 'info');
            
            // Wait for Ruffle to be available
            let attempts = 0;
            while (!window.RufflePlayer?.newest && attempts < 100) {
                await new Promise(r => setTimeout(r, 100));
                attempts++;
            }

            if (!window.RufflePlayer?.newest) {
                log('Ruffle failed to load!', 'error');
                return;
            }

            const Ruffle = window.RufflePlayer.newest();
            log('Ruffle version: ' + (Ruffle?.version || 'unknown'), 'info');

            // Create player programmatically
            const playerContainer = document.getElementById('player');
            
            try {
                // Method 1: Ruffle.newest().createPlayer()
                if (Ruffle.createPlayer) {
                    log('Using createPlayer() API', 'info');
                    const rufflePlayer = Ruffle.createPlayer();
                    rufflePlayer.id = 'ruffle-player';
                    rufflePlayer.style.width = '1024px';
                    rufflePlayer.style.height = '768px';
                    playerContainer.appendChild(rufflePlayer);
                    rufflePlayer.load({ url: 'swf/main.swf', autoplay: 'on', allowScriptAccess: true, allowNetworking: 'all' });
                    log('SWF load initiated via createPlayer()', 'info');
                    
                    rufflePlayer.addEventListener('loadedmetadata', () => {
                        document.getElementById('loading').style.display = 'none';
                        log('SWF loaded (loadedmetadata)!', 'info');
                    });
                    rufflePlayer.addEventListener('load', () => {
                        document.getElementById('loading').style.display = 'none';
                        log('SWF loaded (load)!', 'info');
                    });
                }
                // Method 2: RufflePlayer.attach (polyfill mode)
                else if (Ruffle.attach) {
                    log('Using attach() API', 'info');
                    const rufflePlayer = Ruffle.attach(playerContainer, 'swf/main.swf');
                    log('SWF load initiated via attach()', 'info');
                }
                // Method 3: Use <embed> polyfill
                else {
                    log('Using <embed> polyfill mode', 'info');
                    playerContainer.innerHTML = '<embed src="swf/main.swf" type="application/x-shockwave-flash" width="1024" height="768" allowscriptaccess="always" allownetworking="all" allowfullscreen="true">';
                    // Ruffle should auto-upgrade the embed
                }
            } catch (e) {
                log('SWF load error: ' + e.message, 'error');
                // Fallback: try <embed> polyfill
                log('Trying <embed> fallback', 'warn');
                playerContainer.innerHTML = '<embed src="swf/main.swf" type="application/x-shockwave-flash" width="1024" height="768" allowscriptaccess="always" allownetworking="all" allowfullscreen="true">';
            }

            // Hide loading after 15s as fallback
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                log('Loading screen dismissed (timeout)', 'info');
            }, 15000);
        });
    </script>

    <!-- Load Ruffle from local self-hosted build -->
    <script src="ruffle/web/ruffle.js"></script>
</body>
</html>
